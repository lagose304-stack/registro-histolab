name = "registro-histolab"
main = "server/src/worker.js"
workers_dev = false
preview_urls = false
compatibility_date = "2026-08-04"
compatibility_flags = ["nodejs_compat"]

[alias]
"iconv-lite" = "./server/src/shims/iconv-lite.cjs"

[assets]
directory = "./client/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
NODE_ENV = "production"
PORT = "8080"
ACCOUNT_ACTIVATION_ENABLED = "true"
# Temporal durante el diagnóstico; volver a "true" al cerrar la incidencia.
ACCOUNT_ACTIVATION_RATE_LIMITS_ENABLED = "false"
SUPABASE_URL = "https://dghmrqyxrjgxceolqplt.supabase.co"

# SUPABASE_KEY y JWT_SECRET se configuran como secretos de Cloudflare.
